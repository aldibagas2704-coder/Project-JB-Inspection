<!DOCTYPE html>
<html lang="id">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>
    Dashboard Inspeksi
  </title>

  <link
    href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap"
    rel="stylesheet"
  >

  <link
    rel="stylesheet"
    href="dashboard.css"
  >

</head>

<body>

  <div class="container">

    <!-- ========================= -->
    <!-- SIDEBAR -->
    <!-- ========================= -->

    <aside class="sidebar">

      <div class="brand">

        <img
          class="brand-logo"
          src="assets/logo.png"
          alt="Logo"
        >

        <h2>
          Dashboard Inspeksi
        </h2>

      </div>

      <p class="version">
        v1.0 • Single File
      </p>

      <nav>

        <ul>

          <li>
            <button data-page="dashboard-home.html">
              🏠 Dashboard
            </button>
          </li>

          <li>
            <button data-page="form.html">
              📝 Form Inspeksi
            </button>
          </li>

          <li>
            <button data-page="database.html">
              💾 History
            </button>
          </li>

          <li>
            <button data-page="jadwal.html">
              📅 Jadwal Inspeksi
            </button>
          </li>

        </ul>

      </nav>

    </aside>

    <!-- ========================= -->
    <!-- CONTENT -->
    <!-- ========================= -->

    <section class="content">

      <iframe
        id="iframe-content"
        src="dashboard-home.html"
        frameborder="0"
      ></iframe>

    </section>

  </div>

  <script src="dashboard.js"></script>



  <!-- =========================
DETAIL MODAL
========================= -->

<div
  class="modal fade"
  id="analyticsModal"
  tabindex="-1"
>

  <div class="modal-dialog modal-xl">

    <div class="modal-content">

      <div class="modal-header">

        <h5
          class="modal-title"
          id="analyticsModalTitle"
        >
          Detail Analytics
        </h5>

        <button
          type="button"
          class="btn-close"
          data-bs-dismiss="modal"
        ></button>

      </div>

      <div class="modal-body">

        <div id="analyticsModalContent">
          Loading...
        </div>

      </div>

    </div>

  </div>

</div>
  

</body>
</html>
