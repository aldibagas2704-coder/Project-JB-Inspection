<!DOCTYPE html>
<html lang="id">
  <script src="auth-guard.js"></script>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard Inspeksi</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="dashboard.css">
</head>
<body>
  <div class="container">

    <!-- SIDEBAR -->
    <aside class="sidebar">
      <div class="brand">
        <img class="brand-logo" src="assets/logo.png" alt="Logo">
        <div>
          <h2>Dashboard Inspeksi</h2>
          <p class="version">v1.0 • Single File</p>
        </div>
      </div>

      <nav>
        <ul>
          <li>
            <button class="nav-btn active" data-page="dashboard-home.html">
              <span class="nav-icon">🏠</span> Dashboard Monitoring
            </button>
          </li>

          <li>
            <button class="nav-btn nav-pareto" data-page="pareto.html">
              <span class="nav-icon">📊</span> Analisis Pareto
            </button>
          </li>

          <li>
            <button class="nav-btn" data-page="form.html">
              <span class="nav-icon">📝</span> Form Inspeksi
            </button>
          </li>

          <li>
            <button class="nav-btn" data-page="database.html">
              <span class="nav-icon">💾</span> Database History
            </button>
          </li>

          <li>
            <button class="nav-btn" data-page="jadwal.html">
              <span class="nav-icon">📅</span> Input Jadwal Inspeksi
            </button>
          </li>
        </ul>
      </nav>
    </aside>

    <!-- CONTENT -->
    <section class="content">
      <iframe id="iframe-content"
              src="dashboard-home.html"
              frameborder="0">
      </iframe>
    </section>

  </div>

  <script src="dashboard.js"></script>
</body>
</html>
